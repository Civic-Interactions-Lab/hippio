name: hippio-prod

services:
  backend:
    build:
      context: ./Hungry-Hippo-Game
      dockerfile: Dockerfile.backend
    environment:
      NODE_ENV: production
      PORT: ${BACKEND_HOST_PORT:-4000}
      ALLOWED_ORIGINS: http://localhost,http://localhost:${FRONTEND_HOST_PORT:-80}
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:${POSTGRES_PORT:-5432}/${POSTGRES_DB}?sslmode=disable
    ports:
      - "${BACKEND_HOST_PORT:-4000}:${BACKEND_HOST_PORT:-4000}"
    healthcheck:
      test: [
        "CMD-SHELL",
        "node -e \"fetch('http://localhost:${BACKEND_HOST_PORT:-4000}/health').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))\""
      ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./Hungry-Hippo-Game
      dockerfile: Dockerfile.frontend
      args:
        VITE_WSS_URL: ${VITE_WSS_URL:-ws://localhost:${BACKEND_HOST_PORT:-4000}/api}
        VITE_API_BASE: ${VITE_API_BASE:-http://localhost:${BACKEND_HOST_PORT:-4000}/api}
    # Don't expose ports directly when scaling - let the load balancer handle it
    # ports:
    #   - "${FRONTEND_HOST_PORT:-80}:${FRONTEND_HOST_PORT:-80}"
    environment:
      BACKEND_HOST_PORT: ${BACKEND_HOST_PORT:-4000}
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  # Load balancer for scaling frontend instances
  frontend-lb:
    image: nginx:alpine
    ports:
      - "${FRONTEND_HOST_PORT:-80}:80"
    volumes:
      - ./frontend-nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:${POSTGRES_PORT:-5432}"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "PGPASSWORD=\"$${POSTGRES_PASSWORD}\" psql -h 127.0.0.1 -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\" -c 'SELECT 1' >/dev/null 2>&1 || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  adminer:
    image: adminer:latest
    ports:
      - "${ADMINER_HOST_PORT:-8080}:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      - postgres
    restart: unless-stopped

volumes:
  postgres_data:

