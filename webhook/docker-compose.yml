name: hippio-webhook

services:
  webhook:
    build: .
    restart: unless-stopped
    ports:
      - "${PORT:-9000}:9000"
    env_file: .env
    environment:
      GIT_SSH_COMMAND: "ssh -o StrictHostKeyChecking=accept-new"
    volumes:
      # Let the container talk to the host Docker daemon
      - /var/run/docker.sock:/var/run/docker.sock
      # Mount the application repo from the host
      - ${HOST_REPO_DIR:-/opt/hippio}:/workspace
      # Mount SSH keys so git can use SSH remotes
      - ~/.ssh:/root/.ssh:ro
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9000/health"]
      interval: 30s
      timeout: 5s
      retries: 3


