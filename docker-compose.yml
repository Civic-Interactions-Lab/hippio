name: hippio-local

services:
  backend:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./Hungry-Hippo-Game:/app
    command: sh -c "npm install && npm run api"
    environment:
      NODE_ENV: development
      PORT: 4000
      ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000, http://0.0.0.0:3000
    ports:
      - "4000:4000"
    restart: unless-stopped

  frontend:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./Hungry-Hippo-Game:/app
      - frontend_node_modules:/app/node_modules
    command: sh -c "npm install && npm run dev --host 0.0.0.0 --port 3000"
    environment:
      VITE_WSS_URL: ws://localhost:4000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    profiles: ["db"]
    environment:
      POSTGRES_DB: hippio
      POSTGRES_USER: hippio
      POSTGRES_PASSWORD: hippio
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  frontend_node_modules:
  backend_node_modules:
  postgres_data:

